name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download upscaling model
        run: |
          mkdir -p app/src/main/assets
          test -f app/src/main/assets/model.tflite || curl -fL -o app/src/main/assets/model.tflite "https://huggingface.co/qualcomm/Real-ESRGAN-General-x4v3/resolve/main/Real-ESRGAN-General-x4v3.tflite"
          ls -l app/src/main/assets
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Upscaler-APK
          path: app/build/outputs/apk/debug/app-debug.apk
